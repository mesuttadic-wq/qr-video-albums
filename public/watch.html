
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Видеоальбом — ожившие воспоминания</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px;
  background: #14243e;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

main {
  width: 100%;
  max-width: 760px;
  text-align: center;
}

.brand {
  color: #e7d1a2;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: bold;
}

h1 {
  font-size: clamp(25px, 5vw, 38px);
  margin: 20px 0 12px;
}

.subtitle {
  color: #c4cede;
  margin-bottom: 30px;
}

.video-frame {
  background: #080e1a;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  box-shadow: 0 12px 35px #0005;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

a {
  display: inline-block;
  margin-top: 24px;
  color: #e7d1a2;
  text-decoration: none;
}

.footer {
  margin-top: 40px;
  color: #8fa0b9;
  font-size: 12px;
}

/* Улучшенное оформление для смартфонов */

body {
  justify-content: flex-start;
  padding-top: 28px;
}

main {
  max-width: 480px;
}

.video-frame {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
  aspect-ratio: 9 / 16;
}

@media (min-width: 768px) {
  body {
    padding-top: 48px;
  }
}     
</style>
</head>

<body>
<main>
  <div class="brand">ВЫПУСКНОЙ АЛЬБОМ</div>

  <h1>Моменты, которые остаются</h1>

  <p class="subtitle">
    Нажмите на видео, чтобы оживить воспоминание
  </p>

  <div class="video-frame">
    <iframe id="player"
            title="Видео из альбома"
            allow="autoplay; fullscreen"
            allowfullscreen>
    </iframe>
  </div>

  <a id="openVideo" href="#" target="_blank"
     rel="noopener noreferrer">
    Открыть видео отдельно ↗
  </a>

  <div class="footer">
    Сохраняем самые тёплые воспоминания
  </div>
</main>

<script>
const params = new URLSearchParams(location.search);
const fileId = params.get("file");

if (fileId && /^[A-Za-z0-9_-]{15,}$/.test(fileId)) {
  const base = "https://drive.google.com/file/d/"
    + fileId;

  document.getElementById("player").src =
    base + "/preview";

  document.getElementById("openVideo").href =
    base + "/view";
} else {
  document.querySelector(".subtitle").textContent =
    "Видео не найдено";
  document.querySelector(".video-frame").hidden = true;
  document.getElementById("openVideo").hidden = true;
}
</script>
</body>
</html>
